name: Build Nintendo Switch NRO

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          apt-get update
          apt-get install -y cmake make git build-essential

      - name: Configure and Compile Switch App
        run: |
          mkdir -p build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/Switch.cmake ..
          make -j$(nproc)

      - name: Deep Search and Upload Finished NRO File
        uses: actions/upload-artifact@v4
        with:
          name: Custom-Dusklight-Switch
          path: |
            **/*.nro
