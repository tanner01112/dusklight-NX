name: Build Nintendo Switch NRO

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # This hides that Node20 warning

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          apt-get update
          apt-get install -y cmake make git build-essential

      - name: Configure CMake for Switch
        run: |
          mkdir -p build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/Switch.cmake .. || echo "CMake configuration failed, continuing to log error..."

      - name: Compile Source Code
        run: |
          cd build
          make -j$(nproc)

      - name: Upload Finished NRO File
        uses: actions/upload-artifact@v4
        with:
          name: Custom-Dusklight-Switch
          path: build/*.nro
          
