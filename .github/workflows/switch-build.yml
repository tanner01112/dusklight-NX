name: Build Nintendo Switch NRO

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set Git Trust Exceptions
        run: |
          git config --global --add safe.directory /__w/dusklight-NX/dusklight-NX
          git config --global --add safe.directory /__w/dusklight-NX/dusklight-NX/build/_deps/dawn-src

      - name: Install System Dependencies
        run: |
          apt-get update
          apt-get install -y cmake make git build-essential

      - name: Run CMake Configuration
        run: |
          mkdir -p build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/Switch.cmake \
                -DCMAKE_BUILD_TYPE=Release \
                -DSDL_THREADS=ON \
                -DSDL_PTHREADS=OFF \
                -DHAVE_PTHREADS=ON \
                -DDAWN_BUILD_VULKAN=OFF \
                -DDAWN_BUILD_OPENGL=OFF \
                -DDAWN_ENABLE_NULL=ON ..

      - name: Run Make Compilation
        run: |
          cd build
          make -j$(nproc)

      - name: Deep Search and Upload Finished NRO File
        uses: actions/upload-artifact@v4
        with:
          name: Custom-Dusklight-Switch
          path: |
            **/*.nro
        with:
          name: Custom-Dusklight-Switch
          path: |
            **/*.nro
